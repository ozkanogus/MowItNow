name: CI

on:
  pull_request:
  push:
    branches:
      - modernization/java21-spring-boot

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test
        run: ./moveitnow/gradlew -p moveitnow --no-daemon clean test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: mow-it-now:ci
